name = "Profiles"
description = "Power profile management"
icon = "scales"
type = "actions"

[source]
type = "native"
kind = "profiles"
interval = 5

[badges.default]
template = '{% if profile == "power-saver" %}{{ "leaf" | icon }}{% elif profile == "performance" %}{{ "lightning" | icon }}{% else %}{{ "scales" | icon }}{% endif %}'
condition = '{{ profile != "balanced" }}'

[[actions]]
name = "power-saver"
run = "native"
key = "s"
label = "saver"
icon = "leaf"

[[actions]]
name = "balanced"
run = "native"
key = "b"
label = "balanced"
icon = "scales"

[[actions]]
name = "performance"
run = "native"
key = "p"
label = "performance"
icon = "lightning"

[[key-hints]]
key = "Esc"
action = "back"
label = "back"
