name = "Audio"
description = "Speakers, microphones, and audio routing"
icon = "speaker-high"
type = "audio"

[source]
type = "native"
kind = "audio"
interval = 1

[badges.sink]
template = '{% if muted %}{{ "speaker-slash" | icon }}{% else %}{{ "speaker-high" | icon }}{% endif %}'
condition = "{{ muted }}"

[badges.source]
template = '{{ "microphone-slash" | icon }}'
condition = "{{ source_muted }}"

[widget]
template = '{% if muted %}muted{% else %}{{ volume | meter(max=100, width=20) }}{% endif %}'

[[actions]]
name = "up"
run = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
label = "vol up"

[[actions]]
name = "down"
run = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
label = "vol down"

[[actions]]
name = "mute"
run = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
label = "mute"

[[actions]]
name = "mic-up"
run = "wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%+"
label = "mic up"

[[actions]]
name = "mic-down"
run = "wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%-"
label = "mic down"

[[actions]]
name = "mic-mute"
run = "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
label = "mic mute"

[[actions]]
name = "denoise"
run = "native"
label = "denoise"

[[hooks]]
condition = '{{ changed(key="volume") or changed(key="muted") }}'
action = "spotlight"
timeout = 3

[[key-hints]]
key = "←→"
action = ""
label = "select"

[[key-hints]]
key = "⏎"
action = ""
label = "default sink"

[[key-hints]]
key = "i"
action = ""
label = "default mic"

[[key-hints]]
key = "↑↓"
action = ""
label = "vol"

[[key-hints]]
key = "m"
action = ""
label = "mute"

[[key-hints]]
key = "n"
action = ""
label = "denoise"

[[key-hints]]
key = "p"
action = ""
label = "bt profile"

[[key-hints]]
key = "Esc"
action = "back"
label = "back"
